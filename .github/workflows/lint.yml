name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-syntax:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The Dockerfile builds on `php:8-cli`, a moving tag. Linting across the
        # supported 8.x line means a syntax-level incompatibility shows up here
        # rather than when that tag advances under a future build.
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - uses: actions/checkout@v4

      - name: Syntax check every PHP file
        run: |
          docker run --rm -v "$PWD/src:/src:ro" "php:${{ matrix.php }}-cli" \
            sh -c 'find /src -name "*.php" -not -path "/src/vendor/*" -print0 \
                   | xargs -0 -r -n1 php -l'
